# skill-verify
#
# Guards what the skill center itself guarantees, on every push/PR to main.
# Runs on windows-latest because provider installs use NTFS junction
# semantics that only Windows exercises faithfully.
#
# Steps:
#   1. `python tools/skillctl.py verify --ci`
#      Registry and repo invariants: entry shape, install methods, that
#      every mapped location is one its provider scans, one owner per
#      location, provenance, repo skills present with matching frontmatter,
#      no unregistered skill folders. Never reads the home directory, so
#      third-party skills that live outside the repo are not its business.
#   2. `python -m unittest discover -s tests`
#      skillctl install, repair, idempotency, archive and verify behaviour,
#      run against throwaway homes via SKILLCTL_HOME - including this repo's
#      real registry installed into an empty home.
#   3. `pwsh tests/skill-center.e2e.ps1 -CI`
#      Repo-content checks: SKILL.md frontmatter, evals.json /
#      trigger-evals.json shape, README catalog rows, and the dependency
#      order between the workflow skills. -CI skips the home-dir junction
#      checks (step 2 runs them against its sandbox install).
#
# Every step must exit 0; any non-zero exit fails the build.

name: skill-verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: skillctl repo-local invariants
        run: python tools/skillctl.py verify --ci

      - name: skillctl behaviour in a sandboxed home
        run: python -m unittest discover -s tests -v

      - name: E2E repo-content checks (CI mode)
        shell: pwsh
        run: pwsh -NoProfile -File tests/skill-center.e2e.ps1 -CI
